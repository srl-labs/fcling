name: ci
on:
  # The badge reports the latest run on the default branch, so main has to run
  # on push as well. Scoped to main: an unscoped push trigger would run a second
  # time for every pull request opened from a branch in this repository.
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # Quoted: unquoted 3.10 would be read as the number 3.1
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version from the tags.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: make lint
      - name: Run tests
        run: make test

  releases:
    name: SR Linux ${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        # Quoted: unquoted 25.10 would be read as the number 25.1. Keep to
        # SUPPORTED in tests/release_coverage.py.
        release: ["25.10", "26.3", "26.7"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      # Test ids carry the release. A line with no recordings selects no tests,
      # and pytest exits non-zero.
      - name: Replay the recordings of this release
        run: uv run pytest -q tests/test_release_matrix.py tests/test_release_reads.py -k "${{ matrix.release }}"

  image:
    name: container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: VERSION=0.0.0
          cache-from: type=gha
          # A cache write that loses a race with another run must not fail the build.
          cache-to: type=gha,mode=max,ignore-error=true
